spring.application.name=docflow

# Database Configuration
spring.datasource.url=jdbc:h2:file:./data/docflow
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# OCR Configuration
docflow.ocr.default-language=ara
docflow.ocr.chunk-size=10
docflow.ocr.retry-max-attempts=3
docflow.ocr.retry-initial-interval=1000
docflow.ocr.retry-multiplier=2.0
docflow.ocr.skip-limit=5

# Processing/Extraction Configuration
docflow.processing.chunk-size=10
docflow.processing.skip-limit=3
docflow.processing.invoice-keywords=invoice,INV-,bill,amount due,total

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
